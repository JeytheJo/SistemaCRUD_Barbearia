<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bodies Barber — Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}"/>
</head>
<body class="dash-page">

  <div class="dither-bg"></div>

  <header class="dash-header">
    <div class="brand">
      <span class="brand-title" style="font-size:2rem;">Bodies</span>
      <span class="brand-sub" style="letter-spacing:4px;">Barber</span>
    </div>
    <div class="dash-user">
      <span class="dash-user-nome">{{ nome }}</span>
      <a class="dash-logout" href="/logout">SAIR</a>
    </div>
  </header>

  <main class="dash-main">
    <h1 class="dash-title">PAINEL DE CONTROLE</h1>

    <div class="dash-grid">

      <a class="dash-card" href="/agendamentos">
        <div class="dash-card-icon">◈</div>
        <div class="dash-card-label">AGENDAMENTOS</div>
        <div class="dash-card-sub">CRUD — INSERT / UPDATE / DELETE</div>
      </a>

      <a class="dash-card" href="/servicos">
        <div class="dash-card-icon">✦</div>
        <div class="dash-card-label">SERVIÇOS</div>
        <div class="dash-card-sub">CRUD — GERENCIAR CATÁLOGO</div>
      </a>

      <a class="dash-card" href="/barbeiros">
        <div class="dash-card-icon">⊕</div>
        <div class="dash-card-label">BARBEIROS</div>
        <div class="dash-card-sub">LEFT JOIN + FUNCTION</div>
      </a>

      <a class="dash-card" href="/clientes">
        <div class="dash-card-icon">◉</div>
        <div class="dash-card-label">CLIENTES</div>
        <div class="dash-card-sub">LEFT JOIN — TOTAL AGENDAMENTOS</div>
      </a>

      <a class="dash-card" href="/relatorio" style="grid-column: 1 / -1; border-color: var(--verm-escuro);">
        <div class="dash-card-icon" style="color:#cc6600;">⬡</div>
        <div class="dash-card-label">RELATÓRIO GERAL</div>
        <div class="dash-card-sub">VIEW — vw_agendamentos_completos + PROCEDURE + FUNCTION</div>
      </a>

    </div>
  </main>

</body>
</html>
